# Configuration for train_hybrid.py: train on a mix of real and synthetic frames.
#
# Usage:
#   python train_hybrid.py configs/hybrid.yaml
#
# The real-data, label, model, loss and training sections are those of
# configs/real.yaml; the gaussians section is that of configs/synthetic.yaml.
# Relative paths are resolved from the directory the script is run in.

seed: 0

# ----------------------------------------------------------------------------
# Mix
# ----------------------------------------------------------------------------
hybrid:
  synthetic_fraction: 0.5  # share of the training and validation sets that is synthetic

# ----------------------------------------------------------------------------
# Real RHEED frames
# ----------------------------------------------------------------------------
data:
  path: ../data/STO_STO_test6_06292022-standard-compressed.h5   # RHEED_data_file
  exclude_groups: []     # h5 groups to drop before the split (the notebook used all of them,
                         # including background_with_heater / background_without_heater)
  training_growths: 7    # TRAINING_GROWTHS
  validation_growths: 2  # VALIDATION_GROWTHS
  test_growths: 1        # TEST_GROWTHS
  images_per_growth: 1000  # IMAGES_PER_GROWTH (frames sampled without replacement per growth)

image:
  x: 320                 # IMAGE_X: raw frames are zero-padded symmetrically up to this size
  y: 320                 # IMAGE_Y
  scale_factor: 8        # SCALE_FACTOR: label cell = scale_factor x scale_factor pixels
                         # LABEL_X = x // scale_factor, LABEL_Y = y // scale_factor

# ----------------------------------------------------------------------------
# Synthetic frames (2D Gaussians on the full image.x x image.y frame)
# ----------------------------------------------------------------------------
gaussians:
  crop_x: 48             # GAUSSIAN_X: spot centers are kept crop_x/2 away from the edges
  crop_y: 48             # GAUSSIAN_Y
  min_num: 3             # MIN_NUM_GAUSSIANS
  max_num: 3             # MAX_NUM_GAUSSIANS
  min_std_x: 5           # MIN_STD_X
  max_std_x: 11          # MAX_STD_X
  min_std_y: 5           # MIN_STD_Y
  max_std_y: 11          # MAX_STD_Y
  min_theta: 0           # MIN_THETA (radians; a string such as "pi" or "pi/2" is accepted)
  max_theta: pi          # MAX_THETA
  min_intensity: 0.2     # MIN_INTENSITY
  max_intensity: 0.8     # MAX_INTENSITY

# ----------------------------------------------------------------------------
# Pseudo-labels: spots found by thresholding a smoothed, log-scaled crop
# ----------------------------------------------------------------------------
labels:
  clip:                  # crop (in padded-image pixels) searched for spots
    left: 100            # LEFT_CLIP
    right: 200           # RIGHT_CLIP
    top: 30              # TOP_CLIP
    bottom: 270          # BOTTOM_CLIP
  smoothing_sigma: 2     # gaussian_filter sigma applied to log1p(crop)
  percentile: 85         # pixels above this percentile of the smoothed crop count as spot
  soft_label_sigma: 0.75 # SOFT_LABEL_SIGMA (in label cells; real and synthetic labels)
  threshold: 0.9         # THRESHOLD (kept from the notebook; currently unused)

# Random circular shift applied to train / validation frames (test frames are not shifted)
augment:
  min_x_roll: 0          # MIN_X_ROLL
  max_x_roll: 300        # MAX_X_ROLL (exclusive)
  min_y_roll: 0          # MIN_Y_ROLL
  max_y_roll: 300        # MAX_Y_ROLL (exclusive)

# ----------------------------------------------------------------------------
# Datasets
# ----------------------------------------------------------------------------
dataset:
  training_size: 10000   # real + synthetic (real frames drawn with replacement)
  validation_size: 1000  # real + synthetic
  test_size: 1000        # per source: 1000 real and 1000 synthetic test frames
  batch_size: 50         # BATCH_SIZE

# ----------------------------------------------------------------------------
# QKeras model
# ----------------------------------------------------------------------------
model:
  name: baby_yolo
  total_bits: 8          # TOTAL_BITS
  integer_bits: 0        # INTEGER_BITS
  # One residual block per entry: stride-2 QConv2D(3x3) + quantized ReLU,
  # then QConv2D(3x3) + BatchNorm added back onto it.
  block_filters: [4, 6, 8]
  head_filters: 8        # 1x1 Conv2D before the final 1x1 Conv2D + sigmoid

# ----------------------------------------------------------------------------
# Loss
# ----------------------------------------------------------------------------
loss:
  pos_weight: 5.0        # POS_WEIGHT
  neg_weight: 1.0        # NEG_WEIGHT

# ----------------------------------------------------------------------------
# Training
# ----------------------------------------------------------------------------
training:
  train: true            # TRAIN_MODEL
  load_from: null        # LOAD_MODEL: path to a saved model to load before training/testing
  epochs: 100            # NUM_EPOCHS
  learning_rate: 1.0e-3
  global_clipnorm: 1.0
  early_stopping:
    patience: 10         # EARLY_STOPPING_PATIENCE
    min_delta: 1.0e-4    # MIN_DELTA
  reduce_lr:
    factor: 0.5
    patience: 5
    min_lr: 1.0e-5

# ----------------------------------------------------------------------------
# Outputs
# ----------------------------------------------------------------------------
output:
  save_model: true       # SAVE_MODEL
  models_dir: Models
  model_name: hybrid_flow_model   # MODEL_NAME -> saved to <models_dir>/<model_name>
  num_plot_examples: 4   # test examples per source to render (image / label / prediction) as PNGs
